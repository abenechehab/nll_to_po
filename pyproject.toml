[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]

[project]
name = "NLL_TO_PO"
authors = [
  {name = "Abdelhakim Benechehab", email = "abdelhakim.benechehab@gmail.com"},
  {name = "Gabriel Singer", email = "gabrielsinger2@gmail.com"},
]
maintainers = [
  {name = "Abdelhakim Benechehab", email = "abdelhakim.benechehab@gmail.com"},
  {name = "Gabriel Singer", email = "gabrielsinger2@gmail.com"},
]
dynamic = ["version", "readme", "dependencies"]
description = "Official implementation of 'From Data to Rewards: a Bilevel Optimization Perspective on Maximum Likelihood Estimation' "
requires-python = ">=3.12"
keywords = ["Policy optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.12",
  "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.1",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = ['ruff', 'pre-commit', 'black', 'detect-secrets']
mbrl = ['minari[h5py]==0.5.3', 'ray[default]==2.48.0', 'pyarrow==21.0.0']
classif = ['scikit-learn==1.7.1', 'ucimlrepo==0.0.7', 'tabulate==0.9.0']
bilevel = ['torchopt==0.7.3']
llm = ['transformers==4.56.1', 'accelerate==1.10.1']

[tool.setuptools]
license-files = ['LICEN[CS]E*', 'COPYING*', 'NOTICE*', 'AUTHORS*']

[project.scripts]

[tool.setuptools.dynamic]
readme = { file = ["README.md"] }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools_scm]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
